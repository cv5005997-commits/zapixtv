name: Build ZapixTV APK

on:
  push:
    paths:
      - 'Zapix.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Inspect and extract ZIP
        shell: bash
        run: |
          set -euo pipefail
          echo "ZIP contents:"
          unzip -l Zapix.zip
          mkdir -p source
          unzip -q Zapix.zip -d source
          echo "Extracted files:"
          find source -maxdepth 5 -type f | sort | head -300
          SETTINGS="$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo "::error::No Gradle settings.gradle(.kts) found in Zapix.zip"
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Detected Android/Gradle project at: $PROJECT_DIR"
          if ! find "$PROJECT_DIR" -maxdepth 2 -type f \( -name build.gradle -o -name build.gradle.kts \) | grep -q .; then
            echo "::error::No Gradle build.gradle(.kts) found near project root"
            exit 1
          fi

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon --stacktrace clean assembleDebug
          else
            gradle --no-daemon --stacktrace clean assembleDebug
          fi
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZapixTV-debug-apk
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error

# Trigger build workflow
