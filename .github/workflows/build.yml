name: Build ZapixTV APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract and inspect ZIP
        id: project
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo "::error::No se encontró un ZIP en la raíz."
            exit 1
          fi
          mkdir -p source
          unzip -q "$ZIP" -d source
          SETTINGS="$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo "::error::El ZIP no contiene settings.gradle ni settings.gradle.kts."
            find source -maxdepth 5 -type f | head -200
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Proyecto detectado en: $PROJECT_DIR"
          find "$PROJECT_DIR" -maxdepth 3 -type f | sort | head -200

      - name: Apply Kotlin initialization fix
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          FILE="$(find . -type f -path '*/src/main/java/com/zapix/tv/PlayerEngine.kt' -print -quit)"
          if [ -z "$FILE" ]; then
            echo "::error::No se encontró PlayerEngine.kt; no se aplicó ningún cambio."
            exit 1
          fi
          if grep -q 'private val player: ExoPlayer' "$FILE"; then
            sed -i 's/private val player: ExoPlayer/private lateinit var player: ExoPlayer/' "$FILE"
          fi
          grep -n 'player' "$FILE" | head -20
          if ! grep -q 'private lateinit var player: ExoPlayer' "$FILE"; then
            echo "::error::No se pudo verificar la corrección de inicialización de player."
            exit 1
          fi

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon --stacktrace clean assembleDebug
          else
            gradle --no-daemon --stacktrace clean assembleDebug
          fi

      - name: Verify APK
        id: apk
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find . -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::Gradle terminó pero no produjo un APK debug."
            exit 1
          fi
          echo "path=$PWD/$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZapixTV-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="${{ steps.apk.outputs.path }}"
          if gh release view v1.0.0 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload v1.0.0 "$APK" --repo "${{ github.repository }}" --clobber
          else
            gh release create v1.0.0 "$APK" --repo "${{ github.repository }}" --title "ZapixTV v1.0.0" --notes "APK compilado automáticamente desde el ZIP del repositorio."
          fi

# Re-run with the verified PlayerEngine initialization fix.
