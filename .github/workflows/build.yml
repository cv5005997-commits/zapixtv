name: Build ZapixTV APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          test -n "$ZIP"
          mkdir source
          unzip -q "$ZIP" -d source
          echo "ZIP usado: $ZIP"
          find source -maxdepth 3 -type f | head -80

      - name: Patch PlayerEngine initialization
        shell: bash
        run: |
          set -euo pipefail
          FILE="$(find source -type f -name PlayerEngine.kt -print -quit)"
          if [ -n "$FILE" ]; then
            python3 - "$FILE" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text()
          old = "private val player: ExoPlayer"
          new = "private lateinit var player: ExoPlayer"
          count = s.count(old)
          if count == 1:
              p.write_text(s.replace(old, new, 1))
              print("PlayerEngine.kt parcheado")
          elif count == 0 and "private lateinit var player: ExoPlayer" in s:
              print("PlayerEngine.kt ya estaba corregido")
          else:
              raise SystemExit(f"No se pudo aplicar el parche de forma segura; coincidencias: {count}")
          PY
          fi

      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS="$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          test -n "$SETTINGS"
          echo "dir=$(dirname "$SETTINGS")" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="$GITHUB_WORKSPACE/${{ steps.project.outputs.dir }}"
          cd "$PROJECT_DIR"
          echo "Proyecto Gradle: $PWD"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew clean assembleDebug
          else
            echo "No hay gradlew dentro del ZIP; usando Gradle instalado en el runner."
            gradle clean assembleDebug
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZapixTV-debug-apk
          path: ${{ steps.project.outputs.dir }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find source -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"
          test -n "$APK"
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 "$APK" --clobber
          else
            gh release create v1.0.0 "$APK" --title "ZapixTV v1.0.0" --notes "APK compilado mediante GitHub Actions."
          fi

